# Systemd drop-in override for sbd.service
# SBD in watchdog-only mode self-fences nodes on ANY disruption.
# This override fixes a PID file race condition.
# NOTE: sbd is NOT ordered after nvme-cluster-init.service. The previous
# After= ordering stranded the surviving node whenever the peer was down:
# nvme-cluster-init loops forever (StartLimitIntervalSec=0) waiting for the
# peer target, which blocked sbd -> corosync -> pacemaker from ever starting.
# Decoupling lets the cluster stack come up on a lone surviving node; gfs2-group
# simply stays failed until the peer returns and the fabric is re-established.
[Unit]

[Service]
# Fallback to write the PID file if the inquisitor fails to do so in time
ExecStartPost=/bin/bash -c 'for i in {1..30}; do pid=$$(pgrep -f "sbd: inquisitor" | head -n 1); if [ -n "$$pid" ]; then echo $$pid > /run/sbd.pid; exit 0; fi; sleep 1; done; exit 1'

TimeoutStartSec=60
