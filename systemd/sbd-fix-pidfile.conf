# Systemd drop-in override for sbd.service
# SBD in watchdog-only mode self-fences nodes on ANY disruption.
# This override satisfies the dependency chain (corosync/pacemaker
# require sbd.service) without running actual SBD.
[Unit]
After=nvme-cluster-init.service

[Service]
Type=oneshot
RemainAfterExit=yes
PIDFile=

# Override ExecStart to just echo success - no SBD daemon at all
ExecStart=
ExecStart=/bin/bash -c 'echo "SBD override: running in no-op mode (fencing disabled)"; exit 0'

# No-op stop
ExecStop=
ExecStop=/bin/true

TimeoutStartSec=10
