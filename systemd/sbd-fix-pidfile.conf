# Systemd drop-in override for sbd.service
# Fixes SBD 1.5.2 diskless/watchdog-only mode where the parent process
# always exits(1) even though the inquisitor children are running fine.
#
# Root cause: SBD with -W (watchdog-only, no SBD_DEVICE) forks the
# inquisitor and watchers successfully, but the parent reports "sbd failed"
# and exits with status 1. With Type=forking + PIDFile, systemd can't
# track the correct process, cascading to pacemaker not starting.
#
# Fix: Type=oneshot + RemainAfterExit. We launch SBD (ignoring its bogus
# exit code), verify the inquisitor is alive, then exit. Systemd marks
# the service "active (exited)" without needing to track any PID.
#
# IMPORTANT: /etc/default/sbd must have SBD_OPTS="-W" for diskless/
# watchdog-only mode. Without -W, SBD 1.5.2 immediately exits with
# "sbd failed" because it has no device to monitor and doesn't
# automatically enable the watchdog.
#
# Install to: /etc/systemd/system/sbd.service.d/override.conf
# Then run:   sudo systemctl daemon-reload

[Unit]
After=nvme-cluster-init.service

[Service]
Type=oneshot
RemainAfterExit=yes
PIDFile=

ExecStart=
ExecStart=/bin/bash -c '\
  /usr/sbin/sbd ${SBD_OPTS} watch 2>&1 || true; \
  sleep 3; \
  if pgrep -x sbd > /dev/null 2>&1; then \
    echo "SBD inquisitor running (PID: $(pgrep -x sbd | head -1))"; \
    exit 0; \
  else \
    echo "ERROR: SBD inquisitor not running after launch"; \
    exit 1; \
  fi'

ExecStop=
ExecStop=/bin/bash -c 'killall -TERM sbd 2>/dev/null || true'

TimeoutStartSec=30
Restart=on-failure
RestartSec=10
